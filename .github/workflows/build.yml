name: Build

# 手动触发：Actions → Build → Run workflow
# 或者在打 tag 时自动构建（v* 触发）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须 21：gradle-wrapper 是 9.4.1，且 gradle/gradle-daemon-jvm.properties 里
      # toolchainVersion=21。用 17 的话 Gradle 会自己去下载 JDK 21，白等几分钟。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # 提供 sdkmanager 并接受 license，AGP 才能自动拉 compileSdk 37 的 platform
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 签名：配置了 Secrets 就用你自己的 keystore（可覆盖安装）；
      # 没配就自动回退 debug 签名（app/build.gradle.kts 内建逻辑，能出包但要先卸载原版）
      - name: Build release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp -v {} out/ \;
          echo '--- result ---'
          ls -lh out/

      - name: Show signature
        run: |
          APK=$(find out -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppVolumeBarHook-1.1.13-hl
          path: out/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
